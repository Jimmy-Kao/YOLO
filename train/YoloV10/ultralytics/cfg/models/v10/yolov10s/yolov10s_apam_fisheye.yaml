# Parameters
nc: 80
scales:
  s: [0.33, 0.50, 1024]

# Fisheye-oriented YOLOv10s:
# - APAM after the P2/4 stage preserves small-object and boundary details.
# - APAM after the P4/16 stage refines distorted mid-level geometry before the head.
# - No APAM at P5/32: keep the deepest semantic path lightweight and stable.
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2f, [128, True]] # 2
  - [-1, 1, APAM, [128]] # 3-P2 refinement
  - [-1, 1, Conv, [256, 3, 2]] # 4-P3/8
  - [-1, 6, C2f, [256, True]] # 5
  - [-1, 1, SCDown, [512, 3, 2]] # 6-P4/16
  - [-1, 6, C2f, [512, True]] # 7
  - [-1, 1, APAM, [512]] # 8-P4 refinement
  - [-1, 1, SCDown, [1024, 3, 2]] # 9-P5/32
  - [-1, 3, C2fCIB, [1024, True, True]] # 10
  - [-1, 1, SPPF, [1024, 5]] # 11
  - [-1, 1, PSA, [1024]] # 12

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 13
  - [[-1, 7], 1, Concat, [1]] # 14: P5 -> P4, use refined P4
  - [-1, 3, C2f, [512]] # 15-P4/16

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 16
  - [[-1, 5], 1, Concat, [1]] # 17: P4 -> P3
  - [-1, 3, C2f, [256]] # 18-P3/8

  - [-1, 1, Conv, [256, 3, 2]] # 19
  - [[-1, 15], 1, Concat, [1]] # 20: P3 -> P4
  - [-1, 3, C2f, [512]] # 21-P4/16

  - [-1, 1, SCDown, [512, 3, 2]] # 22
  - [[-1, 12], 1, Concat, [1]] # 23: P4 -> P5
  - [-1, 3, C2fCIB, [1024, True, True]] # 24-P5/32

  - [[18, 21, 24], 1, v10Detect, [nc]] # P3, P4, P5
