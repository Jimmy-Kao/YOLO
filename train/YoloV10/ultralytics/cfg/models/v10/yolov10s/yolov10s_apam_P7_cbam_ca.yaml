# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolov8n.yaml' will call yolov8.yaml with scale 'n'
  # [depth, width, max_channels]
  s: [0.33, 0.50, 1024]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]                 # 0
  - [-1, 1, Conv, [128, 3, 2]]                # 1
  - [-1, 3, C2f, [128, True]]                 # 2
  - [-1, 1, CoordAtt, [128]]                  # 3 (CA added)
  - [-1, 1, Conv, [256, 3, 2]]                # 4
  - [-1, 6, C2f, [256, True]]                 # 5
  - [-1, 1, CBAM, [256]]                      # 6 (CBAM added)
  - [-1, 1, SCDown, [512, 3, 2]]              # 7
  - [-1, 6, C2f, [512, True]]                 # 8
  - [-1, 1, APAM, [512]]                      # 9 (APAM kept)
  - [-1, 1, SCDown, [1024, 3, 2]]             # 10
  - [-1, 3, C2fCIB, [1024, True, True]]       # 11
  - [-1, 1, SPPF, [1024, 5]]                  # 12
  - [-1, 1, PSA, [1024]]                      # 13
# YOLOv8.0n head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]    # 14
  - [[-1, 8], 1, Concat, [1]]                     # 15  (P4)
  - [-1, 3, C2f, [512]]                            # 16

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]    # 17
  - [[-1, 5], 1, Concat, [1]]                     # 18  (P3)
  - [-1, 3, C2f, [256]]                            # 19

  - [-1, 1, Conv, [256, 3, 2]]                     # 20
  - [[-1, 16], 1, Concat, [1]]                     # 21 (P4 head)
  - [-1, 3, C2f, [512]]                            # 22

  - [-1, 1, SCDown, [512, 3, 2]]                   # 23
  - [[-1, 13], 1, Concat, [1]]                     # 24 (P5)
  - [-1, 3, C2fCIB, [1024, True, True]]            # 25

  - [[19, 22, 25], 1, v10Detect, [nc]]              # 26